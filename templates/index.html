<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Chat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        
        <!-- Join Screen -->
        <div class="card shadow-lg border-0 rounded-4 animate__animated animate__zoomIn" id="joinScreen" style="width: 100%; max-width: 420px;">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">💬 Join a Chat</h2>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Your Name</label>
                    <input type="text" id="usernameInput" class="form-control form-control-lg" placeholder="e.g. Ansh" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Room Name</label>
                    <input type="text" id="roomInput" class="form-control form-control-lg" placeholder="e.g. general" required>
                </div>
                
                <button class="btn btn-primary btn-lg w-100 fw-bold" id="joinBtn">Join Room</button>
            </div>
        </div>

        <!-- Chat Screen -->
        <div class="card shadow-lg border-0 rounded-4 d-none" id="chatScreen" style="width: 100%; max-width: 700px; height: 80vh;">
            <div class="card-header bg-dark text-white rounded-top-4 d-flex justify-content-between align-items-center p-3">
                <div>
                    <strong id="roomLabel">#general</strong>
                </div>
                <button class="btn btn-sm btn-outline-light" id="leaveBtn">Leave</button>
            </div>
            
            <div class="card-body p-3" id="messages" style="overflow-y: auto; background: #f8f9fa;">
                <!-- Messages appear here -->
            </div>
            
            <div class="card-footer bg-white rounded-bottom-4 p-3">
                <form id="messageForm" class="d-flex gap-2">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." autocomplete="off">
                    <button type="submit" class="btn btn-primary px-4">Send</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
